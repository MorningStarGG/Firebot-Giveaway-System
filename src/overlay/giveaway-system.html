            const rawPlacement = config.styles?.imagePlacement;
            let placement = usesImage ? (rawPlacement || 'above') : 'none';

            if (!usesWidget && usesImage) {
                placement = 'above';
            }

            if (config.styles?.showImage === false && usesImage && (!rawPlacement || rawPlacement === 'above' || rawPlacement === 'background' || rawPlacement === 'below')) {
                placement = 'none';
            }

            if (imageOnly && placement === 'background') {
                placement = 'above';
            }

            const useBackground = placement === 'background' && usesWidget;
            const isLeftPlacement = placement === 'left';
            const isRightPlacement = placement === 'right';
            const isHorizontalPlacement = isLeftPlacement || isRightPlacement;
            const isBelowPlacement = placement === 'below';
            const isAbovePlacement = !isBelowPlacement && !isHorizontalPlacement;
            const safeImageUrl = imageUrl ? imageUrl.replace(/"/g, '\\"') : '';
            const imageEnabled = usesImage && placement !== 'none' && config.styles?.showImage !== false;
            const showImage = (imageEnabled || imageOnly) && !!imageUrl;
            const hasImage = !!imageUrl && (imageEnabled || imageOnly);
            const imageScale = Math.max(0.1, Number(config.styles?.imageScale) || 1);
            const targetImageHeight = Math.max(20, 220 * imageScale);
            const targetImageWidth = Math.max(20, giveawayWidthNumber * imageScale);
            const imageWidthValue = `${targetImageWidth}px`;
            const imageMarginValue = isHorizontalPlacement ? '0' : '0 auto';
            if (containerEl) {
                containerEl.style.setProperty('--target-image-height', `${targetImageHeight}px`);

                    const sizePx = Math.max(8, Number(config.display?.imageTextSize) || 18);

                    positions.forEach(p => imageTextEl.classList.remove(p));
                    imageTextEl.classList.add(positions.includes(position) ? position : 'bottom');
                    imageTextEl.style.fontSize = `${sizePx}px`;
                    const textColor = config.styles?.imageTextColor || config.styles?.textColor || '#e3e3e3';
                    const placeholderColor = config.styles?.imageTextPlaceholderColor || textColor;
                    imageTextEl.style.color = textColor;

                    const computeText = () => {
                        const status = getStatusText(config, hasPendingWinner, entriesClosed);
                        const timeRemaining = getTimeRemainingForDisplay(config, hasPendingWinner);
                        const replacements = {
                            prize: `<span class="image-text-placeholder" style="color:${placeholderColor};">${escapeHtml(config.giveawayData?.prize || '')}</span>`,
                            title: `<span class="image-text-placeholder" style="color:${placeholderColor};">${escapeHtml(config.giveawayData?.title || '')}</span>`,
                            entrycommand: `<span class="image-text-placeholder" style="color:${placeholderColor};">${escapeHtml(config.giveawayData?.entryCommand || '')}</span>`,
                            claimcommand: `<span class="image-text-placeholder" style="color:${placeholderColor};">${escapeHtml(config.giveawayData?.claimCommand || '')}</span>`,
                            entries: `<span class="image-text-placeholder" style="color:${placeholderColor};">${String(config.totalEntries || 0)}</span>`,
                            status: `<span class="image-text-placeholder" style="color:${placeholderColor};">${escapeHtml(status)}</span>`,
                            time: `<span class="image-text-placeholder" style="color:${placeholderColor};">${timeRemaining != null ? formatTime(timeRemaining) : ''}</span>`
                        };
                        imageTextEl.innerHTML = formatTemplate(template, replacements);
                    };

                    computeText();
                    if (template.includes('{time}')) {
                        imageTextInterval = setInterval(computeText, 1000);
                    }
                    imageTextEl.style.display = 'block';

            const slideModeRaw = (config.display?.slideMode || 'disabled').toString().toLowerCase();
            const slideModeBase = usesWidget && usesImage ? slideModeRaw : 'disabled';
            const slideCycleEnabled = slideModeBase === 'widget';
            const revealIntervalSeconds = Math.max(1, Number(config.display?.slideRevealIntervalSeconds) || 8);
            const visibleSeconds = Math.max(1, Number(config.display?.slideVisibleSeconds) || 4);
            const slideImageEnabled = slideModeBase === 'image';

            // Rotation modes should only run while the giveaway is actively accepting entries, no cycling/sliding if there is a pending winner or a completed winner
            const hasPendingWinnerForRotation = Array.isArray(config.pendingWinners)

            const hasCompletedWinnerForRotation = Array.isArray(config.winners) && config.winners.length > 0;

            const canSlideImage = allowRotationByState && slideImageEnabled && usesWidget && usesImage && showImage && !useBackground && !slideCycleEnabled && !imageCycleEnabled;
            const canCycleImage = allowRotationByState && imageCycleEnabled && usesWidget && usesImage && showImage && !useBackground && !canSlideCycle && !canSlideImage;

                if (imageElement) {

                    imageElement.style.transform = '';
                    imageElement.style.opacity = '';
                    imageElement.style.pointerEvents = '';
                }
            } else if (canSlideCycle) {
                clearSwapInterval();
                clearSlideCycle();
                if (containerEl) {
                    containerEl.classList.add('slide-cycle');
                    containerEl.classList.remove('slide-image');
                    containerEl.classList.remove('slide-image-showing');
                    containerEl.classList.remove('swap-mode');
                    containerEl.style.removeProperty('--swap-slot-height');
                    containerEl.style.removeProperty('min-height');
                }

                // Temporarily show widget to get accurate measurement
                widget.style.display = '';
                widget.style.maxHeight = 'none';
                widget.style.maxWidth = 'none';
                widget.style.opacity = '1';

                if (containerEl) {
                    const measuredWidth = widget.scrollWidth || widget.offsetWidth || widget.getBoundingClientRect().width || 0;
                    const measuredHeight = widget.scrollHeight || widget.offsetHeight || widget.getBoundingClientRect().height || 0;

                    const fallbackWidth = giveawayWidthNumber;
                    const finalWidth = Math.max(measuredWidth, fallbackWidth);

                    if (isHorizontalPlacement) {
                        if (finalWidth > 0) {
                            containerEl.style.setProperty('--slide-target-width', `${finalWidth + 24}px`);
                        }
                        if (measuredHeight > 0) {
                            containerEl.style.setProperty('--slide-fixed-height', `${measuredHeight}px`);
                        }
                    } else {
                        containerEl.style.removeProperty('--slide-target-width');
                        containerEl.style.removeProperty('--slide-fixed-height');
                        if (measuredHeight > 0) {
                            containerEl.style.setProperty('--slide-target-height', `${measuredHeight + 24}px`);
                        }
                    }
                }

                // Reset widget styles
                widget.style.maxHeight = '';
                widget.style.maxWidth = '';
                widget.style.opacity = '';

                if (imageElement) {
                    imageElement.style.display = 'block';
                    imageElement.style.width = imageWidthValue;
                    imageElement.style.maxWidth = imageWidthValue;
                    imageElement.style.height = `${targetImageHeight}px`;
                    imageElement.style.maxHeight = `${targetImageHeight}px`;
                    imageElement.style.margin = imageMarginValue;
                }
                widget.style.display = '';

                const applySlideState = (showWidgetNow) => {
                    if (!containerEl) return;
                    if (showWidgetNow) {
                        // Measure widget size for accurate max dimension
                        const currentSizeRaw = isHorizontalPlacement
                            ? (widget.scrollWidth || widget.offsetWidth || widget.getBoundingClientRect().width || 0)
                            : (widget.scrollHeight || widget.offsetHeight || 0);
                        const currentSize = isHorizontalPlacement
                            ? Math.max(currentSizeRaw, giveawayWidthNumber)
                            : currentSizeRaw;
                        if (currentSize > 0) {
                            const sizeVar = isHorizontalPlacement ? '--slide-target-width' : '--slide-target-height';
                            containerEl.style.setProperty(sizeVar, `${currentSize + 24}px`);
                            if (!isHorizontalPlacement) {
                                containerEl.style.removeProperty('--slide-target-width');
                            }
                        }
                        // Use requestAnimationFrame to ensure smooth class addition
                        requestAnimationFrame(() => {
                            if (containerEl) {
                                containerEl.classList.add('slide-showing');
                            }
                        });
                    } else {
                        containerEl.classList.remove('slide-showing');
                    }
                };

                applySlideState(false);
                const startCycle = () => {
                    applySlideState(true);
                    slideHideTimeout = setTimeout(() => {
                        applySlideState(false);
                        slideRevealTimeout = setTimeout(startCycle, revealIntervalSeconds * 1000);
                    }, visibleSeconds * 1000);
                };

                slideRevealTimeout = setTimeout(startCycle, revealIntervalSeconds * 1000);
            } else if (canSlideImage) {
                // Reverse mode, Widget stays visible, image slides in/out
                clearSwapInterval();
                clearSlideCycle();
                clearSlideImageCycle();
                if (containerEl) {
                    containerEl.classList.add('slide-image');
                    containerEl.classList.remove('slide-cycle');
                    containerEl.classList.remove('slide-showing');
                    containerEl.classList.remove('swap-mode');
                    containerEl.classList.remove('cycle-mode');
                    containerEl.style.removeProperty('--slide-target-height');
                    containerEl.style.removeProperty('--slide-target-width');
                    containerEl.style.removeProperty('--swap-slot-height');
                    containerEl.style.removeProperty('min-height');
                }

                // Widget is always visible
                widget.style.display = '';
                widget.style.maxHeight = '';
                widget.style.opacity = '';

                if (imageElement) {
                    // Wrap image in container div
                    let imageWrapper = imageElement.parentElement;
                    if (!imageWrapper || !imageWrapper.classList.contains('image-slide-wrapper')) {
                        imageWrapper = document.createElement('div');
                        imageWrapper.className = 'image-slide-wrapper';
                        imageElement.parentNode.insertBefore(imageWrapper, imageElement);
                        imageWrapper.appendChild(imageElement);
                    }

                    // Set fixed size on image itself
                    imageElement.style.display = 'block';
                    imageElement.style.width = imageWidthValue;
                    imageElement.style.maxWidth = imageWidthValue;
                    imageElement.style.height = `${targetImageHeight}px`;
                    imageElement.style.maxHeight = 'none';
                    imageElement.style.margin = imageMarginValue;
                    imageElement.classList.add('visible');

                    // Set target dimension on wrapper for animation
                    if (containerEl) {
                        const measuredImageWidth = imageElement.getBoundingClientRect().width || targetImageWidth;
                        containerEl.style.removeProperty('--slide-image-target-height');
                        containerEl.style.removeProperty('--slide-image-target-width');
                        if (isHorizontalPlacement) {
                            containerEl.style.setProperty('--slide-image-target-width', `${measuredImageWidth + 24}px`);
                        } else {
                            containerEl.style.setProperty('--slide-image-target-height', `${targetImageHeight + 24}px`);
                        }
                    }
                }

                const applyImageSlideState = (showImageNow) => {
                    if (!containerEl) return;
                    if (showImageNow) {
                        if (imageElement) {
                            const measuredImageSize = isHorizontalPlacement
                                ? (imageElement.getBoundingClientRect().width || targetImageWidth)
                                : (imageElement.getBoundingClientRect().height || targetImageHeight);
                            const sizeVar = isHorizontalPlacement ? '--slide-image-target-width' : '--slide-image-target-height';
                            containerEl.style.setProperty(sizeVar, `${measuredImageSize + 24}px`);
                            if (isHorizontalPlacement) {
                                containerEl.style.removeProperty('--slide-image-target-height');
                            } else {
                                containerEl.style.removeProperty('--slide-image-target-width');
                            }
                        }
                        requestAnimationFrame(() => {
                            if (containerEl) {
                                containerEl.classList.add('slide-image-showing');
                            }
                        });
                    } else {
                        containerEl.classList.remove('slide-image-showing');
                    }
                };

                applyImageSlideState(false);
                const startImageCycle = () => {
                    applyImageSlideState(true);
                    slideImageHideTimeout = setTimeout(() => {
                        applyImageSlideState(false);
                        slideImageRevealTimeout = setTimeout(startImageCycle, revealIntervalSeconds * 1000);
                    }, visibleSeconds * 1000);
                };

                slideImageRevealTimeout = setTimeout(startImageCycle, revealIntervalSeconds * 1000);
            } else {
                clearSlideCycle();
                clearSlideImageCycle();
                if (containerEl) {
                    containerEl.classList.remove('slide-cycle');
                    containerEl.classList.remove('slide-showing');
                    containerEl.classList.remove('slide-image');
                    containerEl.classList.remove('slide-image-showing');
                }
                const widgetHeight = widget.getBoundingClientRect().height || widget.offsetHeight || 0;
                const slotHeight = Math.max(widgetHeight, targetImageHeight);
                const imageWrapper = containerEl ? containerEl.querySelector('.imageWrapper') : null;

                if (containerEl) {
                    containerEl.style.minHeight = `${slotHeight}px`;
                    containerEl.style.display = 'grid';
                    containerEl.classList.add('cycle-mode');
                }

                if (imageElement) {
                    const baseHeight = imageScale > 0 ? targetImageHeight / imageScale : targetImageHeight;
                    imageElement.style.display = 'block';
                    imageElement.style.width = '100%';
                    imageElement.style.maxWidth = '100%';
                    imageElement.style.height = `${baseHeight}px`;
                    imageElement.style.maxHeight = `${baseHeight}px`;
                    imageElement.style.margin = imageMarginValue;
                    imageElement.style.transformOrigin = 'center center';
                    imageElement.style.transform = `scale(${imageScale})`;
                }

                if (imageWrapper) {
                    imageWrapper.style.gridArea = '1 / 1';
                    imageWrapper.style.transition = 'opacity 0.5s ease-in-out';
                }

                widget.style.display = 'block';
                widget.style.gridArea = '1 / 1';
                widget.style.transition = 'opacity 0.5s ease-in-out';

                const applySwap = (showImageNow) => {
                    swapShowingImage = showImageNow;
                    if (imageWrapper) {
                        imageWrapper.style.opacity = showImageNow ? '1' : '0';
                        imageWrapper.style.pointerEvents = showImageNow ? 'auto' : 'none';
                    }
                    widget.style.opacity = showImageNow ? '0' : '1';
                    widget.style.pointerEvents = showImageNow ? 'none' : 'auto';
                };

                clearSwapInterval();
                applySwap(false);
                swapInterval = setInterval(() => {
                    applySwap(!swapShowingImage);
                }, cycleSeconds * 1000);
            }

            const showTitle = config.display?.showTitle !== false;
            const titleContainer = container.querySelector('.title');
            if (titleContainer) {
                titleContainer.style.display = showTitle ? '' : 'none';
            }

            const prizeVisibility = config.display?.prizeVisibility
                || (config.display?.showPrize === false ? 'disabled'
                    : (config.display?.showPrizeLabel === false ? 'prize-only' : 'label-prize'));
            const showPrizeContainer = prizeVisibility !== 'disabled';
            const showPrizeLabel = prizeVisibility === 'label-prize' || prizeVisibility === 'label-only';
            const showPrizeValue = prizeVisibility === 'label-prize' || prizeVisibility === 'prize-only';
            const prizeContainer = container.querySelector('.prizeContainer');
            if (prizeContainer) {
                prizeContainer.style.display = showPrizeContainer ? '' : 'none';
            }
            // Update title
            const titleElement = container.querySelector('.title');
            if (titleElement) {
                titleElement.textContent = config.giveawayData.title;
            }

            // Update prize
            const prizeElement = container.querySelector('.prize');
            if (prizeElement) {
                prizeElement.textContent = config.giveawayData.prize;
                prizeElement.style.color = config.styles?.prizeColor || config.styles?.textColor || '';
                prizeElement.style.display = showPrizeValue ? '' : 'none';
            }
            const prizeLabelEl = container.querySelector('.prize-label');
            if (prizeLabelEl) {
                prizeLabelEl.textContent = config.giveawayData.prizeLabelText || 'PRIZE';
                prizeLabelEl.style.color = config.styles?.prizeLabelColor || '';
                prizeLabelEl.style.display = showPrizeLabel ? '' : 'none';
            }

            // Update entries count
            const entriesElement = container.querySelector('.entries-count');
            if (entriesElement) {
                entriesElement.style.color = entryNumberColor;
                const newCount = config.totalEntries || 0;
                const entryKey = giveawayId || 'default';
                if (Number.isFinite(lastEntriesCountMap[entryKey]) && lastEntriesCountMap[entryKey] !== newCount) {
                    triggerEntryBurst(entriesElement);
                    tickerEntryBurstPending = true;
                }
                lastEntriesCountMap[entryKey] = newCount;
                entriesElement.textContent = newCount;
            }

            // Update entry command and close timer
            const pendingWinners = config.pendingWinners || [];
            const hasPendingWinner = pendingWinners.length > 0;

            // Update claim timer state for all pending winners
            const currentPendingKeys = new Set();
            for (const winner of pendingWinners) {
                if (winner.status === 'pending') {
                    updateClaimTimerState(winner);
                    const key = winner.winId || getWinnerIdentifier(winner);
                    currentPendingKeys.add(key);
                }
            }
            // Clean up timer state for winners that are no longer pending
            for (const key of Object.keys(claimTimerState)) {
                if (!currentPendingKeys.has(key)) {
                    delete claimTimerState[key];
                }
            }
            const statusColors = getStatusColors(config);
            const statusText = getStatusText(config, hasPendingWinner, entriesClosed);
            const statusNotOpen = statusText.toLowerCase() !== 'open';
            currentCloseTime = (!isPaused && !statusNotOpen) ? (config.closeTime || null) : null;

            // Store close timer remaining seconds for accurate display
            if (!isPaused && !statusNotOpen && typeof config.closeRemainingSeconds === 'number' && config.closeRemainingSeconds > 0) {
                closeRemainingSecondsFromServer = config.closeRemainingSeconds;
                closeTimerStartTime = Date.now();
            } else if (isPaused || statusNotOpen || !config.closeTime) {
                closeRemainingSecondsFromServer = null;
                closeTimerStartTime = null;
            }
            const entryCommandElement = container.querySelector('.entry-command');
            const closeTimerElement = container.querySelector('.close-timer-command');
            const entryCommandText = config.display?.entryCommandText || 'Type {command} to join!';
            const closeTimerText = config.display?.closeTimerText || 'Time left: {time}';
            const winnerPendingText = config.display?.winnerPendingText || 'Winner pending';
            const closeTimerTextColor = config.styles?.closeTimerTextColor || config.styles?.closeTimerColor || '';
            const closeTimerValueColor = config.styles?.closeTimerValueColor || config.styles?.closeTimerColor || '';
            const claimTimerTextColor = config.styles?.claimTimerTextColor || config.styles?.claimTimerColor || config.styles?.closeTimerColor || '';
            const claimTimerValueColor = config.styles?.claimTimerValueColor || config.styles?.claimTimerColor || config.styles?.closeTimerColor || '';
            const entryTextColor = config.styles?.entryTextColor || config.styles?.textColor || '';
            const claimTextColor = config.styles?.claimTextColor || config.styles?.textColor || '';
            const entryCommandString = config.giveawayData.entryCommand || '!enter';
            const entryCommandHtml = formatTemplate(entryCommandText, {
                command: `<span class="command-text">${escapeHtml(entryCommandString)}</span>`
            });

            if (entryCommandElement) {
                if (statusNotOpen) {
                    const statusDisplay = hasPendingWinner ? winnerPendingText : statusText;
                    entryCommandElement.textContent = statusDisplay;
                    entryCommandElement.classList.add('entries-closed');
                    const closedColor = getStatusValueColor(statusDisplay, statusColors)
                        || entryTextColor
                        || config.styles?.entriesClosedColor
                        || '';
                    entryCommandElement.style.color = closedColor;
                } else {
                    entryCommandElement.innerHTML = entryCommandHtml;
                    entryCommandElement.classList.remove('entries-closed');
                    entryCommandElement.style.color = entryTextColor || '';
                    const cmdSpan = entryCommandElement.querySelector('.command-text') || entryCommandElement.querySelector('span');
                    if (cmdSpan) {
                        cmdSpan.style.color = config.styles?.entryCommandColor || entryTextColor || 'var(--accent-color)';
                    }
                }
            }

            if (closeTimerElement) {
                const closeTimerHtml = formatTemplate(closeTimerText, {
                    command: `<span class="command-text">${escapeHtml(entryCommandString)}</span>`,
                    time: '<span class="close-timer-value"></span>'
                });
                closeTimerElement.innerHTML = closeTimerHtml;
                const closeColorText = closeTimerTextColor || '';
                const closeColorValue = closeTimerValueColor || closeColorText || '';
                closeTimerElement.style.color = closeColorText || '';
                const timeSpan = closeTimerElement.querySelector('.close-timer-value');
                if (timeSpan) {
                    timeSpan.style.color = closeColorValue || '';
                }
                const cmdSpanTimer = closeTimerElement.querySelector('.command-text');
                if (cmdSpanTimer) {
                    cmdSpanTimer.style.color = config.styles?.entryCommandColor || closeColorValue || 'var(--accent-color)';
                }
            }

            if (statusNotOpen) {
                if (entryCommandElement) entryCommandElement.style.display = '';
                if (closeTimerElement) {
                    closeTimerElement.style.display = 'none';
                    closeTimerElement.classList.remove('urgent');
                }
                clearCommandCycle();
            } else if (isMinimal) {
                // In minimal mode, ticker handles display
                if (entryCommandElement) entryCommandElement.style.display = 'none';
                if (closeTimerElement) closeTimerElement.style.display = 'none';
                clearCommandCycle();
            } else if (entryCommandElement && closeTimerElement) {
                // In full mode, start command cycling
                startCommandCycle(container, config, entryCommandElement, closeTimerElement);
            }

            // Handle winner section
            const winnerSection = container.querySelector('.winnerSection');
            const claimSection = container.querySelector('.claimSection');
            const completedWinners = config.winners || [];
            const rotationEnabled = !!config.display?.rotateWinners;
            const rotationPool = rotationEnabled
                ? [...pendingWinners, ...completedWinners]
                : (pendingWinners.length > 0
                    ? pendingWinners
                    : (completedWinners.length > 0 ? [completedWinners[completedWinners.length - 1]] : []));

            const rotationSeconds = Math.max(1, Number(config.display?.pendingWinnerRotationSeconds) || 5);

            const existingIndex = rotationPool.findIndex(w => getWinnerIdentifier(w) === activeWinnerId);
            activeRotationIndex = existingIndex >= 0 ? existingIndex : 0;

            if (imageOnly) {
                clearRotation();
                renderWinner(container, widget, config, null);
            } else if (rotationPool.length === 0 || config.display?.showWinner === false) {
                clearRotation();
                renderWinner(container, widget, config, null);
            } else {
                const renderAtIndex = (index) => {
                    if (rotationPool.length === 0) return;
                    activeRotationIndex = index % rotationPool.length;
                    const current = rotationPool[activeRotationIndex];
                    renderWinner(container, widget, config, current);
                };

                clearRotation();
                renderAtIndex(activeRotationIndex);

                if (rotationEnabled && rotationPool.length > 1) {
                    rotationInterval = setInterval(() => {
                        renderAtIndex(activeRotationIndex + 1);
                    }, rotationSeconds * 1000);
                }
            }

            // Handle paused state
            const pausedOverlay = container.querySelector('.pausedOverlay');
            if (pausedOverlay) {
                if (config.paused) {
                    pausedOverlay.classList.add('active');
                } else {
                    pausedOverlay.classList.remove('active');
                }
            }

            // Handle ended state
            const endedOverlay = container.querySelector('.endedOverlay');
            if (endedOverlay) {
                const hasVisibleWinner = rotationPool && rotationPool.length > 0;
                if (config.ended && !hasVisibleWinner) {
                    endedOverlay.classList.add('active');
                } else {
                    endedOverlay.classList.remove('active');
                }
            }

            // Stats visibility
            const statsContainer = container.querySelector('.statsContainer');
            if (statsContainer) {
                const showEntryCount = config.display?.showEntryCount !== false;
                statsContainer.style.padding = showEntryCount ? '' : '2px 20px';
                const stat = statsContainer.querySelector('.stat');
                if (stat) {
                    stat.style.display = showEntryCount ? '' : 'none';
                }
                const statLabel = statsContainer.querySelector('.stat-label');
                if (statLabel) {
                    statLabel.textContent = config.giveawayData.statLabelText || 'ENTRIES';
                    statLabel.style.color = config.styles?.statLabelColor || '';
                }
            }

            updateTicker(container, config);
        }

        function startGiveawayAnimation(container) {
            const widget = container.querySelector('.giveawayWidget');
            if (widget) {
                widget.classList.remove('starting');
                void widget.offsetWidth;
                widget.classList.add('starting');
                setTimeout(() => widget.classList.remove('starting'), 600);
            }
        }

        // Handle initial display
        if (CONFIG && CONFIG.giveawayData) {
            console.log('Initial giveaway display:', CONFIG);
            updateGiveawayDisplay(CONFIG);
        }

        // Handle giveaway system updates
        window.addEventListener('giveawaySystemUpdate', (event) => {
            console.log('Received giveawaySystemUpdate event:', event);
            const { detail } = event;

            if (!detail || !detail.config) {
                console.error('Missing detail or config in update event');
                return;
            }

            console.log('Processing update with config:', detail.config);

            if (detail.show) {
                const giveawayId = getGiveawayId(detail.config.giveawayTitle);
                const container = document.getElementById(giveawayId);
                if (container) {
                    startGiveawayAnimation(container);
                }
            }

            updateGiveawayDisplay(detail.config);
        });
    </script>
</div>
