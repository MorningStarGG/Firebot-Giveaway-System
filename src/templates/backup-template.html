<style>
    .giveawayNames {
        max-width: 150px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        display: inline-block;
    }

    .giveawayList {
        min-width: 550px;
    }

    .giveawayNames-tooltip-container {
        min-width: 150px;
        height: 40px;
        max-width: 150px;
    }

    .giveawayNames-tooltip {
        display: none;
        position: absolute;
        left: 0;
        top: 100%;
        background-color: #333;
        color: #fff;
        padding: 5px 10px;
        border-radius: 4px;
        white-space: nowrap;
        font-size: 14px;
        z-index: 1000;
    }

    .giveawayNames-tooltip-container:hover .giveawayNames-tooltip {
        display: block;
    }
</style>

<eos-container header="Giveaway Backup Manager" role="region" aria-label="Giveaway Backup Management Interface">
    <div class="input-group" style="margin-bottom: 15px;">
        <span class="input-group-addon" id="mode-label">Giveaway Selection Mode</span>
        <select class="form-control"
                ng-model="effect.giveawaySelectionMode"
                ng-change="effectValueChanged()"
                aria-labelledby="mode-label"
                aria-describedby="mode-description">
            <option value="giveawayList">Giveaway Title List</option>
            <option value="manual">Manual Giveaway Title Entry</option>
        </select>
    </div>

    <div ng-if="effect.giveawaySelectionMode === 'manual'" role="form" aria-label="Manual Giveaway Entry Form">
        <firebot-input
            input-title="Giveaway Title Variable"
            pad-top="true"
            model="effect.manualGiveawayTitle"
            placeholder="$variable or giveaway name"
            aria-label="Enter Giveaway Title">
        </firebot-input>

        <div style="padding-top: 15px;" role="radiogroup" aria-label="Giveaway Action Selection">
            <firebot-radios
                model="effect.action"
                options="{ restore: 'Restore Giveaway', remove: 'Permanently Delete Backup' }"
                inline="true">
            </firebot-radios>
        </div>
    </div>

    <div ng-if="effect.giveawaySelectionMode === 'giveawayList'" role="region" aria-label="Giveaway Backup List">
        <div ng-if="loading" class="text-center" role="status" aria-live="polite">
            <i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Loading backups...
        </div>

        <div ng-if="!loading && (!backupGiveaways || backupGiveaways.length === 0)"
             class="alert alert-info"
             role="alert">
            <i class="fas fa-archive" aria-hidden="true"></i> No backed up giveaways found
        </div>

        <div ng-if="!loading && backupGiveaways.length > 0"
             ng-repeat="giveaway in backupGiveaways"
             class="backup-item"
             style="margin-bottom: 10px; display: flex; justify-content: center; align-items: center;"
             role="listitem">
            <div class="input-group giveawayList">
                <div class="giveawayNames-tooltip-container input-group-addon" role="tooltip">
                    <span class="giveawayNames" aria-label="Giveaway Title">Giveaway: {{giveaway.giveawayData.title}}</span>
                    <div class="giveawayNames-tooltip" role="tooltip">Giveaway: {{giveaway.giveawayData.title}}</div>
                </div>
                <span class="input-group-addon" aria-label="Removal Date">
                    <i class="far fa-clock" aria-hidden="true"></i> {{giveaway.removedAt | date:'medium'}}
                </span>
                <span class="input-group-btn">
                    <button class="btn btn-primary"
                            ng-click="restoreGiveaway(giveaway.id)"
                            aria-label="Restore Giveaway {{giveaway.giveawayData.title}}">
                        <i class="fas fa-undo" aria-hidden="true"></i> Restore
                    </button>
                    <button class="btn btn-danger"
                            ng-click="deleteBackup(giveaway.id)"
                            aria-label="Delete Giveaway Backup {{giveaway.giveawayData.title}}">
                        <i class="fas fa-trash" aria-hidden="true"></i> Delete
                    </button>
                </span>
            </div>
        </div>
    </div>
</eos-container>
